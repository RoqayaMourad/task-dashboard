services:
  - type: web
    name: task-dashboard-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /tasks

  - type: web
    name: task-dashboard-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/task-dashboard/browser

# Deliberately no `routes` here. Both rewrite rules the static site needs
# (SPA fallback to index.html, and proxying /api/* to task-dashboard-api's
# generated *.onrender.com URL) must be added together, in order, via the
# Render Dashboard after task-dashboard-api exists and its real hostname is
# known — see the deployment notes for the exact steps. Splitting the two
# rules between this file and the Dashboard would leave their evaluation
# order (more specific /api/* must be checked before the catch-all /*)
# dependent on how Render merges Blueprint-defined and Dashboard-added
# routes, which isn't something to guess at for a rule the app depends on.
