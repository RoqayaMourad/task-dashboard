<h1 class="text-2xl font-bold text-text-heading">Tasks</h1>

<div class="mt-6">
  <app-task-filters-bar
    [statusFilter]="statusFilter()"
    [priorityFilter]="priorityFilter()"
    [assigneeFilter]="assigneeFilter()"
    [assigneeOptions]="assigneeOptions()"
    [assigneeOptionsStatus]="assigneeOptionsStatus()"
    [mutationPending]="mutationPending()"
    (statusFilterChange)="statusFilter.set($event)"
    (priorityFilterChange)="priorityFilter.set($event)"
    (assigneeFilterChange)="assigneeFilter.set($event)"
    (newTaskRequested)="openCreateForm()"
  />
</div>

@if (showDeleteErrorBanner()) {
  <div role="alert" class="mt-4 rounded-lg bg-white p-4 shadow-chrome">
    <p class="text-sm text-change-negative">{{ deleteErrorMessage() }}</p>
  </div>
}

<div class="mt-6">
  @if (boardSkeleton()) {
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
      @for (col of columns; track col.status) {
        <div class="min-h-[400px] animate-pulse rounded-lg bg-white p-4 shadow-chrome">
          <div class="h-5 w-24 rounded bg-slate-200"></div>
          <div class="mt-4 h-24 rounded bg-slate-200"></div>
        </div>
      }
    </div>
  } @else if (taskStatus() === 'error') {
    <div role="alert" class="rounded-lg bg-white p-6 shadow-chrome">
      <p class="text-sm text-change-negative">Couldn't load tasks.</p>
      <button
        type="button"
        (click)="retryTasks()"
        aria-label="Retry loading tasks"
        class="mt-3 rounded-sm bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-primary-hover"
      >
        Retry
      </button>
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
      @for (col of columns; track col.status) {
        <app-task-column
          [status]="col.status"
          [label]="col.label"
          [tasks]="tasksByStatus()[col.status]"
          [mutationPending]="mutationPending()"
          (editRequested)="openEditForm($event)"
          (deleteRequested)="confirmDelete($event)"
        />
      }
    </div>
  }
</div>

<app-task-form-dialog
  [visible]="formOpen()"
  [mode]="formMode()"
  [task]="editingTask()"
  [assigneeOptions]="assigneeOptions()"
  [assigneeOptionsStatus]="assigneeOptionsStatus()"
  [pending]="mutationPending()"
  [error]="mutationError()"
  (save)="handleSave($event)"
  (dismissed)="closeForm()"
/>

<p-confirmDialog />
