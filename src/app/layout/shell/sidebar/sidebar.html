<aside
  #panel
  id="primary-nav"
  tabindex="-1"
  class="fixed inset-y-0 left-0 z-40 w-64 flex-col gap-4 overflow-y-auto border-r border-slate-200 bg-white p-4 outline-none lg:static lg:z-auto lg:flex lg:w-56"
  [class.flex]="open()"
  [class.hidden]="!open()"
>
  <nav aria-label="Primary" class="flex flex-1 flex-col">
    <ul class="flex flex-col gap-1">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-primary text-white"
            ariaCurrentWhenActive="page"
            (click)="navigated.emit()"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900"
          >
            <span class="h-5 w-5 shrink-0">
              @switch (item.icon) {
                @case ('dashboard') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <rect x="3.5" y="3.5" width="7" height="7" rx="1.25" />
                    <rect x="13.5" y="3.5" width="7" height="7" rx="1.25" />
                    <rect x="3.5" y="13.5" width="7" height="7" rx="1.25" />
                    <rect x="13.5" y="13.5" width="7" height="7" rx="1.25" />
                  </svg>
                }
                @case ('tasks') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <rect x="4" y="4" width="16" height="16" rx="2.5" />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M8.5 12.5l2.3 2.3L16 9.7"
                    />
                  </svg>
                }
                @case ('calendar') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <rect x="4" y="5.5" width="16" height="14.5" rx="2" />
                    <path stroke-linecap="round" d="M4 9.5h16M8 3.5v3M16 3.5v3" />
                  </svg>
                }
                @case ('analytics') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" d="M5 20V11M12 20V4M19 20v-7" />
                  </svg>
                }
                @case ('team') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <circle cx="9" cy="8.5" r="2.75" />
                    <path stroke-linecap="round" d="M3.5 19c.6-3 2.7-4.5 5.5-4.5s4.9 1.5 5.5 4.5" />
                    <circle cx="16.5" cy="9" r="2.25" />
                    <path stroke-linecap="round" d="M15 14.75c2.2.3 3.7 1.7 4.2 4.25" />
                  </svg>
                }
                @case ('settings') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <path
                      stroke-linecap="round"
                      d="M4 7h10M18 7h2M4 12h2M8 12h12M4 17h10M18 17h2"
                    />
                    <circle cx="16" cy="7" r="2" />
                    <circle cx="6" cy="12" r="2" />
                    <circle cx="16" cy="17" r="2" />
                  </svg>
                }
              }
            </span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <button
    type="button"
    disabled
    aria-disabled="true"
    title="Available once task creation ships (Phase 13)"
    class="flex cursor-not-allowed items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white opacity-50"
  >
    <span class="text-base leading-none" aria-hidden="true">+</span>
    New Task
  </button>
</aside>
