<aside
  #panel
  id="primary-nav"
  tabindex="-1"
  class="fixed inset-y-0 left-0 z-40 w-64 flex-col gap-4 overflow-y-auto border-r border-slate-200 bg-white p-4 outline-none lg:static lg:z-auto lg:flex lg:w-60"
  [class.flex]="open()"
  [class.hidden]="!open()"
>
  <nav aria-label="Primary" class="flex flex-1 flex-col">
    <ul class="flex flex-col gap-4">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-primary text-white"
            ariaCurrentWhenActive="page"
            (click)="navigated.emit()"
            class="flex items-center gap-3 rounded-lg px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900"
          >
            <span
              class="flex h-5 w-5 shrink-0 items-center justify-center text-base leading-none"
              aria-hidden="true"
            >
              {{ item.icon }}
            </span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <a
    [routerLink]="['/tasks']"
    [queryParams]="{ new: '' }"
    (click)="navigated.emit()"
    class="flex items-center justify-center gap-2 rounded-sm bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-primary-hover"
  >
    <span class="text-base leading-none" aria-hidden="true">+</span>
    New Task
  </a>
</aside>
