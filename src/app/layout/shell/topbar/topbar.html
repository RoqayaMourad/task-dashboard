<header
  class="flex h-16 items-center gap-3 border-b border-slate-200 bg-white px-4 lg:gap-4 lg:px-6"
>
  <button
    #toggleButton
    type="button"
    class="shrink-0 text-slate-600 hover:text-slate-900 lg:hidden"
    [attr.aria-expanded]="sidebarOpen()"
    aria-controls="primary-nav"
    aria-label="Toggle navigation"
    (click)="toggleSidebar.emit()"
  >
    @if (sidebarOpen()) {
      <svg
        viewBox="0 0 24 24"
        class="h-6 w-6"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      >
        <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
      </svg>
    } @else {
      <svg
        viewBox="0 0 24 24"
        class="h-6 w-6"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      >
        <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    }
  </button>

  <a
    routerLink="/dashboard"
    class="flex shrink-0 items-center gap-2 text-lg font-bold text-primary"
  >
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-white">
      <svg
        viewBox="0 0 24 24"
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      >
        <rect x="4" y="4" width="7" height="7" rx="1.5" />
        <rect x="13" y="4" width="7" height="7" rx="1.5" />
        <rect x="4" y="13" width="7" height="7" rx="1.5" />
        <rect x="13" y="13" width="7" height="7" rx="1.5" />
      </svg>
    </span>
    <span class="hidden sm:inline">Task Manager</span>
  </a>

  <div class="flex flex-1 justify-center px-2">
    <label
      class="flex w-full max-w-[400px] items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 text-sm"
      [class.opacity-60]="!searchEnabled()"
    >
      <svg
        viewBox="0 0 24 24"
        class="h-4 w-4 shrink-0 text-slate-400"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="6.5" />
        <path stroke-linecap="round" d="M20 20l-4.35-4.35" />
      </svg>
      <input
        type="search"
        class="w-full min-w-0 bg-transparent text-slate-700 placeholder:text-slate-400 focus:outline-none disabled:cursor-not-allowed"
        placeholder="Search tasks..."
        aria-label="Search tasks"
        [disabled]="!searchEnabled()"
        [value]="searchValue()"
        (input)="onSearchInput($event)"
      />
    </label>
  </div>

  <span class="flex size-10 shrink-0 items-center justify-center text-slate-400" aria-hidden="true">
    <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.5">
      <path
        d="M6 10a6 6 0 1 1 12 0c0 3.2 1 5 1.5 5.5H4.5C5 15 6 13.2 6 10Z"
        stroke-linejoin="round"
      />
      <path stroke-linecap="round" d="M10 18.5a2 2 0 0 0 4 0" />
    </svg>
  </span>

  <span
    class="flex size-10 shrink-0 items-center justify-center rounded-full bg-slate-200 text-slate-500"
    aria-hidden="true"
  >
    <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor">
      <circle cx="12" cy="8" r="3.5" />
      <path d="M4.5 20c1-4 4-6 7.5-6s6.5 2 7.5 6" />
    </svg>
  </span>
</header>
