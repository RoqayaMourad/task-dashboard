<div class="relative w-full" [class]="chartHeightClass()">
  <canvas #canvas role="img" [attr.aria-label]="ariaLabel()"></canvas>
</div>

<ul [class.sr-only]="compact()" class="mt-3 space-y-1 text-sm text-text-muted">
  @for (slice of data(); track slice.key; let i = $index) {
    <li class="flex items-center gap-2">
      <span
        class="inline-block size-2.5 shrink-0 rounded-full"
        [style.background-color]="dataset().backgroundColor[i]"
        aria-hidden="true"
      ></span>
      <span>
        {{ slice.label }}: {{ slice.count }} {{ slice.count === 1 ? 'task' : 'tasks' }} ({{
          slice.percentage
        }}%)
      </span>
    </li>
  }
</ul>
